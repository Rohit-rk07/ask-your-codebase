[project]
name = "ask-your-codebase"
version = "0.1.0"
description = "RAG Q&A over any GitHub repo, with cited answers"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
askcode = "askcode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
